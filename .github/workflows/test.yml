name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 test_boxfit.py
      - run: python3 boxfit.py examples/gpt-oss-120b.config.json examples/gpt-oss-120b-agent.log --requests-per-day 200
